<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akshat Kansal / Backend Engineer</title>
    <meta name="description" content="Backend engineer. Full stack when needed. Designer when nobody's looking." />
    <script>
      // Set the theme before first paint so there's no flash.
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
      // Start the mascot preview download right away, before the app boots.
      // Same WebKit check as ScrollVideo.jsx (Safari gets the MP4).
      var l = document.createElement('link')
      l.rel = 'preload'
      l.as = 'fetch'
      l.crossOrigin = 'anonymous'
      l.href = /^((?!chrome|android).)*safari/i.test(navigator.userAgent) ? '/mascot/lo.mp4' : '/mascot/lo.webm'
      document.head.appendChild(l)
    </script>
    <link rel="preload" as="image" href="/mascot/poster.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
